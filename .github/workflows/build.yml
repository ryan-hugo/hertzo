name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build Hertzo/Hertzo.csproj -c Release

      - name: Gerar executável único
        run: dotnet publish Hertzo/Hertzo.csproj -c Release -r win-x64 -o out --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash out/Hertzo.exe -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v4
        with:
          name: Hertzo-${{ github.sha }}
          path: out/Hertzo.exe
          retention-days: 14
